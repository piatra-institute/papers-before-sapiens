abstract: "The boundary around *Homo sapiens* is late in the history of human capacities. Fossils from Jebel Irhoud place early members of the clade, or a population close to it, at roughly 315,000 years ago; Omo I gives a minimum age of 233,000 years for eastern Africa. By then, bipedal locomotion, stone-flake production, long-range dispersal, large-animal processing, Acheulean biface manufacture, fire use, wooden weapon production, and extended social learning already had deep histories. Bipedality and stone working reach beyond secure *Homo*. Range expansion, biface manufacture, fire practices, and organic technologies were carried by *Homo erectus*, Neanderthal-lineage populations, Denisovans, *Homo naledi*, *Homo floresiensis*, and poorly resolved regional forms. The sapiens boundary is a taxonomic stabilization inside an older hominin field. The record has the structure of a stratigraphy: upright bodies before large brains, manipulative hands before secure species assignment, tools before modern anatomy, population networks before global replacement. The surviving species inherited this field and narrowed it by outlasting, absorbing, or replacing the other lineages. Read as a stratigraphy of dated capacities, seven of eight precede the Jebel Irhoud boundary and all eight precede Omo I, the deepest by more than 4 million years."
