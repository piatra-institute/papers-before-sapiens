- id: vidal-omo
  kind: source
  passage: Omo I, from the Omo Kibish Formation in Ethiopia, has a revised minimum age of 233,000 years
    [@vidal2022].
  evidence:
    citation_id: vidal2022
    locator: Abstract
    verified: true
    verification_note: DOI 10.1038/s41586-021-04275-8; the Crossref abstract reports a new minimum age
      for the Omo fossils of 233 +/- 22 kyr.
- id: berna-fire
  kind: source
  passage: At Wonderwerk Cave in South Africa, @berna2012 report in situ burning inside the cave at roughly
    1 million years ago.
  evidence:
    citation_id: berna2012
    locator: Abstract
    verified: true
    verification_note: DOI 10.1073/pnas.1117620109; the Crossref abstract reports micromorphological and
      FTIR evidence of burned bone and ashed plant remains, burning in the cave during the early Acheulean
      at approximately 1.0 Ma.
- id: hutson-spears
  kind: source
  passage: The Schöningen spears, redated to around 200,000 years ago [@hutson2025; originally described
    by @thieme1997], show that hominins in Europe before *H. sapiens* made carefully shaped wooden weapons.
  evidence:
    citation_id: hutson2025
    locator: Abstract
    verified: true
    verification_note: DOI 10.1126/sciadv.adv0752; the Crossref abstract places the Schöningen spears
      at ~200,000 years using amino acid geochronology, within Middle Paleolithic Neanderthal contexts.
- id: plummer-nyayanga
  kind: source
  passage: Nyayanga in Kenya, dated to between approximately 3.0 and 2.6 million years ago, associates
    Oldowan artifacts with hippopotamus butchery and *Paranthropus* teeth [@plummer2023].
  evidence:
    citation_id: plummer2023
    locator: Abstract
    verified: true
    verification_note: DOI 10.1126/science.abo7452; the Crossref abstract dates Nyayanga to 3.032-2.581
      Ma, reports two hippopotamid butchery sites and Paranthropus teeth.
- id: dirks-naledi
  kind: source
  passage: '*Homo naledi*, from Rising Star Cave in South Africa, is dated to between 335,000 and 236,000
    years ago [@dirks2017] and was thus contemporary with early *H. sapiens* in Africa despite its small
    brain and unexpected morphology.'
  evidence:
    citation_id: dirks2017
    locator: Abstract
    verified: true
    verification_note: DOI 10.7554/eLife.24231; the Crossref abstract constrains the depositional age
      of Homo naledi to between 236 ka and 335 ka.
- id: reich-denisova
  kind: source
  passage: '@reich2010 showed that Denisovans were a distinct archaic group whose ancestry survives especially
    in parts of Oceania and Asia.'
  evidence:
    citation_id: reich2010
    locator: Abstract
    verified: true
    verification_note: DOI 10.1038/nature09710; the abstract (OpenAlex) reports a genome from a Denisova
      Cave finger bone, a group sharing a common origin with Neanderthals and contributing 4-6% of the
      genomes of present-day Melanesians.
- id: scerri-subdivided
  kind: source
  passage: '@scerri2018 describe this as an origin in subdivided populations, with the explanatory weight
    placed on population structure across regions.'
  evidence:
    citation_id: scerri2018
    locator: Abstract
    verified: true
    verification_note: DOI 10.1016/j.tree.2018.05.005; the abstract (OpenAlex) argues for a highly structured
      African prehistory with morphologically varied H. sapiens-clade populations across Africa.
- id: white-ardi
  kind: source
  passage: '*Ardipithecus ramidus*, at 4.4 million years ago, provides a clearer body, capable of bipedal
    movement on the ground and still strongly adapted to arboreal life [@white2009].'
  evidence:
    citation_id: white2009
    locator: Abstract
    verified: true
    verification_note: DOI 10.1126/science.1175802; the Crossref abstract describes 4.4-million-year-old
      Ar. ramidus combining arboreal clambering and careful climbing with a primitive form of terrestrial
      bipedality.
- id: def-human
  kind: definition
  passage: 'The term here designates a field of lineages: the hominin bodies, techniques, social arrangements,
    and inherited niches through which *H. sapiens* later became possible.'
  rationale: Stipulative widening of "human" to the hominin field; the argument depends on it and states
    that species differences remain real.
- id: assume-onsets
  kind: assumption
  passage: Capacities without one defensible onset date, among them symbolic marking and habitual cooking,
    are excluded.
  rationale: Selection rule for the stratigraphy; including capacities with contested onsets would change
    the counts.
- id: assume-point
  kind: assumption
  passage: The dates are point estimates taken from the cited literature; no new measurements are reported.
  rationale: States that the computation adds no data; its outputs are stratigraphic relations among literature
    dates.
- id: interp-spears
  kind: interpretation
  passage: The exception is wooden weapon manufacture, whose Schöningen instance was redated in 2025 to
    around 200,000 years [@hutson2025], after both Jebel Irhoud and Omo I; the late date reflects the
    rarity of preserved wood and is weak evidence for a late onset.
  rationale: Taphonomic reading of the single exception in the count.
- id: interp-package
  kind: interpretation
  passage: The emergence of *sapiens* is best described as the stabilisation of a package.
  rationale: Central interpretive conclusion drawn from the chronology and from the structured-population
    account.
- id: interp-narrowed
  kind: interpretation
  passage: The diversity of human lineages narrowed late.
  rationale: Summary of the contemporaneity and introgression evidence of section 7.
